<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigo Secreto dos Messias</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🎁 Amigo Secreto dos Messias</h1>

    <div class="container">
        <h2>Adicionar Participantes</h2>
        <div class="input-row">
            <input type="text" id="name" placeholder="Nome">
            <input type="text" id="phone" placeholder="Telefone (opcional)">
            <button onclick="addParticipant()">Adicionar</button>
        </div>

        <h2>Participantes</h2>
        <ul id="participantList"></ul>

        <button class="sort-button" onclick="sortear()">Sortear Amigo Secreto</button>

        <h2>Resultado</h2>
        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
